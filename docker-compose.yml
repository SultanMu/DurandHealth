version: '3.8'

services:
  postgres_durand:
    image: postgres:15
    environment:
      POSTGRES_DB: durandhealth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data_durand:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5444:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend_durand:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres_durand:5432/durandhealth
      - DEBUG=True
      - SECRET_KEY=your-secret-key-here
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,10.191.0.18
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:5000,http://10.191.0.18:5055,https://durandhealth.ngrok.io
    ports:
      - "8008:8008"
    depends_on:
      postgres_durand:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_data_durand:/app/staticfiles
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8008"

  frontend_durand:
    build: ./frontend
    environment:
      - VITE_API_URL=https://api.durandhealth.ngrok.io
      - NODE_ENV=development
      - HOST=0.0.0.0
      - VITE_WS_HOST=0.0.0.0
      - VITE_WS_PORT=5055
    ports:
      - "5055:5000"
    depends_on:
      - backend_durand  
    volumes:
      - ./frontend:/app
      - frontend_data_durand:/app/node_modules
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    command: >
      sh -c "npm install &&
             npm run dev -- --host 0.0.0.0 --port 5000"
volumes:
  postgres_data_durand:
  frontend_data_durand:
  backend_data_durand: