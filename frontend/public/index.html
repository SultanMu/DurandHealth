<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DurandHealth - Healthcare Management Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'medical-blue': '#0066cc',
                    }
                }
            }
        }
    </script>
    <style>
        .bg-gradient-to-br {
            background: linear-gradient(to bottom right, #2563eb, #1e40af);
        }
    </style>
</head>
<body>
    <div class="min-h-screen bg-gradient-to-br from-blue-600 to-blue-800 flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white rounded-lg shadow-2xl p-8">
            <div class="text-center space-y-4 mb-8">
                <div class="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center mx-auto">
                    <div class="w-8 h-8 bg-white rounded-full"></div>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">DurandHealth</h1>
                    <p class="text-gray-600">Healthcare Management Platform</p>
                </div>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Select Your Role
                    </label>
                    <select 
                        id="roleSelect"
                        class="w-full p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    >
                        <option value="">Choose your role...</option>
                        <option value="patient">Patient</option>
                        <option value="hr">HR Manager</option>
                        <option value="corporate">Corporate Admin</option>
                    </select>
                </div>

                <button 
                    onclick="handleLogin()"
                    class="w-full bg-blue-600 text-white py-3 px-4 rounded-md hover:bg-blue-700 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition duration-200 font-medium"
                >
                    Get Started
                </button>
            </div>

            <div class="mt-8 text-center text-sm text-gray-500">
                Secure • HIPAA Compliant • Comprehensive Care Management
            </div>

            <div class="mt-6 grid grid-cols-1 gap-3 text-center">
                <div class="flex items-center justify-center space-x-2 text-blue-600">
                    <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />
                    </svg>
                    <span class="text-xs">Secure Healthcare Data</span>
                </div>
                <div class="flex items-center justify-center space-x-2 text-blue-600">
                    <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span class="text-xs">HIPAA Compliant Platform</span>
                </div>
                <div class="flex items-center justify-center space-x-2 text-blue-600">
                    <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3z" />
                    </svg>
                    <span class="text-xs">Comprehensive Care Management</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function handleLogin() {
            const roleSelect = document.getElementById('roleSelect');
            const selectedRole = roleSelect.value;
            
            if (!selectedRole) {
                alert('Please select a role to continue');
                return;
            }
            
            alert(`Welcome to DurandHealth!\nLogging in as: ${selectedRole}\n\nThis demonstrates the healthcare platform landing page.`);
        }
    </script>
</body>
</html>
